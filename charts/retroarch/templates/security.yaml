apiVersion: v1
kind: ServiceAccount
metadata:
  name: retroarch
automountServiceAccountToken: false
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: retroarch-session
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: false
requiredDropCapabilities: [ALL]
defaultAddCapabilities: []
allowedCapabilities: []
runAsUser:
  type: MustRunAs
  uid: 1000
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 1000
supplementalGroups:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 1000
    {{- range .Values.gpu.supplementalGroups }}
    - min: {{ . }}
      max: {{ . }}
    {{- end }}
seccompProfiles: [runtime/default]
volumes: [configMap, downwardAPI, emptyDir, persistentVolumeClaim, projected, secret]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retroarch-session-scc
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [retroarch-session]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retroarch-session-scc
subjects:
  - kind: ServiceAccount
    name: retroarch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: retroarch-session-scc
